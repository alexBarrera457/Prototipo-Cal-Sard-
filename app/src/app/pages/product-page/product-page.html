@if (loading()) {
  <section class="product-page-status" aria-busy="true" aria-live="polite">
    <p>{{ i18n.t('product.loading') }}</p>
  </section>
} @else if (product(); as prod) {
  <main class="product-page-content">
    <app-product-detail [product]="prod" (backToStore)="backToStore()" />
  </main>
} @else if (notFound()) {
  <main class="product-page-status product-not-found" aria-labelledby="not-found-heading">
    <span class="not-found-kicker">{{ i18n.t('product.not_found_kicker') }}</span>
    <h1 id="not-found-heading">{{ i18n.t('product.not_found_title') }}</h1>
    <p>
      {{ i18n.t('product.not_found_desc') }}
    </p>
    <a [routerLink]="['/tienda-online']" class="not-found-link">
      ← {{ i18n.t('product.back_to_shop') }}
    </a>
  </main>
}
