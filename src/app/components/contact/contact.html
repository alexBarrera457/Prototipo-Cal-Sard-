<section class="contact" id="contacto">
    
  <div class="contact-header">

    <span>CAL SARDÀ · BARCELONA</span>

    <h2>
      Hablemos.
    </h2>

    <p>
      ¿Tienes alguna pregunta sobre nuestros productos,
      pedidos o quieres visitarnos? Estamos aquí para ayudarte.
    </p>

  </div>


  <div class="contact-layout">

    <div class="contact-info">

      <div class="contact-item">
        <span>DIRECCIÓN</span>

        <p>
          Carrer Marina, 237<br>
          08013 Barcelona
        </p>
      </div>


      <div class="contact-item">
        <span>TELÉFONO</span>

        <p>
          932 32 55 08
        </p>
      </div>


      <div class="contact-item">
        <span>EMAIL</span>

        <p>
          sarda@calsarda.com
        </p>
      </div>


      <div class="contact-item">
        <span>HORARIO</span>

        <p>
          Lunes — Viernes<br>
          09:30 — 14:30<br>
          16:30 — 20:30
        </p>
      </div>

    </div>


    <form class="contact-form">

      <div class="form-row">

        <div class="form-group">
          <label>Nombre</label>
          <input type="text" placeholder="Tu nombre">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="tu@email.com">
        </div>

      </div>


      <div class="form-group">
        <label>Asunto</label>
        <input type="text" placeholder="¿En qué podemos ayudarte?">
      </div>


      <div class="form-group">
        <label>Mensaje</label>
        <textarea
          rows="6"
          placeholder="Escribe tu mensaje..."
        ></textarea>
      </div>


      <button type="submit">
        ENVIAR MENSAJE
        <span>→</span>
      </button>

    </form>

  </div>

</section>
