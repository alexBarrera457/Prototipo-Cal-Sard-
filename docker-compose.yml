services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calsarda-app
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_API_URL=${RESEND_API_URL:-https://api.resend.com/emails}
      - NOTIFICATION_STORE_EMAIL=${NOTIFICATION_STORE_EMAIL:-sarda@calsarda.com}
      - NOTIFICATION_SENDER_EMAIL=${NOTIFICATION_SENDER_EMAIL:-pedidos@calsarda.com}
      - PAYMENT_GATEWAY_ENV=${PAYMENT_GATEWAY_ENV:-production}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
